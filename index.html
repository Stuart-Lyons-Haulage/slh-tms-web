<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#063b5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SLH TMS" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>SLH Transport Management</title>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var path = window.location.pathname;
      var tv = path === '/tv' || path === '/operations-wallboard/tv' || path === '/live-runs/tv';
      if (!tv) return;

      // The known-good 28 August Hisense setup did not ask the TV to run the
      // modern React/module application. Restore that execution boundary while
      // retaining the current wallboard design by sending only smart-TV browsers
      // to the new v3 compatibility renderer. Desktop /tv stays on React.
      var ua = String(window.navigator && window.navigator.userAgent || '');
      var hisense = /Hisense|VIDAA|SmartTV|Smart-TV|NetCast|Vewd|Opera TV/i.test(ua);
      if (hisense && path !== '/tv.html') {
        try {
          window.location.replace('/tv.html' + (window.location.search || ''));
          return;
        } catch (e) { /* continue to compatibility fallback */ }
      }
    }());
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function () {
      var path = window.location.pathname;
      var tv = path === '/tv' || path === '/operations-wallboard/tv' || path === '/live-runs/tv';
      if (!tv) return;

      // React is the primary renderer for normal browsers. Older office-TV browsers
      // that cannot execute modules still receive the API-backed compatibility board.
      function appendScript(src, onload) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        if (onload) script.onload = onload;
        document.body.appendChild(script);
      }

      function startCompatibilityWallboard() {
        if (window.__SLH_TV_COMPATIBILITY__) return;
        window.__SLH_TV_COMPATIBILITY__ = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = '/tv-legacy.css?v=20260908-known-good-boundary';
        document.head.appendChild(css);
        var compactCss = document.createElement('link');
        compactCss.rel = 'stylesheet';
        compactCss.href = '/tv-legacy-compact.css?v=20260908-known-good-boundary';
        document.head.appendChild(compactCss);
        appendScript('/tv-timezone-patch.js?v=20260908-known-good-boundary', function () {
          appendScript('/tv-legacy.js?v=20260908-known-good-boundary', function () {
            appendScript('/tv-run-labels-patch.js?v=20260908-known-good-boundary', function () {
              appendScript('/tv-final-timing-patch.js?v=20260908-known-good-boundary');
            });
          });
        });
      }

      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || String(root.textContent || '').replace(/\s+/g, '') !== '' || window.__SLH_TV_REACT_STARTED__) return;
        startCompatibilityWallboard();
      }, 8000);
    }());
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
