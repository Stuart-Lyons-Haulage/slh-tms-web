name: slh-tms-web-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - '**/*.md'
pr:
  branches:
    include:
      - '*'

variables:
  - group: slh-tms-prod
  - name: azureServiceConnection
    value: slh-tms-prod-azure
  - name: azureSubscriptionId
    value: 29d5b52a-5b9f-4b5a-9495-892f1c2a30f3
  - name: azureLocation
    value: uksouth
  - name: resourceGroupName
    value: slh-tms-prod-rg
  - name: appServicePlanName
    value: slh-tms-b1-uksouth-plan
  - name: apiWebAppName
    value: slh-tms-api-prod
  - name: portalWebAppName
    value: slh-tms-portal-prod
  - name: viteApiBaseUrl
    value: https://$(apiWebAppName).azurewebsites.net
  - name: viteEntraTenantId
    value: 5aec48a1-c3c7-4cfd-a073-b38ae50041b1
  - name: viteEntraClientId
    value: b4d086ae-6e9d-4578-8861-e61410127359
  - name: viteEntraApiScope
    value: api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2/Tms.Access
  - name: viteAzureMapsClientId
    value: 58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c

stages:
  - stage: Build
    displayName: Lint and build portal
    jobs:
      - job: BuildPortal
        displayName: Build React portal
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: '22.x'

          - script: |
              corepack enable
              corepack prepare pnpm@10 --activate
            displayName: Enable pnpm

          - task: Cache@2
            displayName: Cache pnpm store
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: Install dependencies

          - script: pnpm run lint
            displayName: Lint

          - script: pnpm run build
            displayName: Build portal
            env:
              VITE_API_BASE_URL: $(viteApiBaseUrl)
              VITE_ENTRA_TENANT_ID: $(viteEntraTenantId)
              VITE_ENTRA_CLIENT_ID: $(viteEntraClientId)
              VITE_ENTRA_API_SCOPE: $(viteEntraApiScope)
              VITE_AZURE_MAPS_CLIENT_ID: $(viteAzureMapsClientId)

          - task: ArchiveFiles@2
            displayName: Package portal static files
            inputs:
              rootFolderOrFile: dist
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/slh-tms-web.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/slh-tms-web.zip
            displayName: Publish portal artifact
            artifact: slh-tms-web

  - stage: DeployProduction
    displayName: Deploy portal to UK South B1 App Service
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployPortal
        displayName: Deploy portal
        pool:
          vmImage: ubuntu-latest
        environment: slh-tms-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: slh-tms-web

                - task: AzureCLI@2
                  displayName: Ensure UK South B1 portal App Service exists
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az account set --subscription "$(azureSubscriptionId)"
                      az group create --name "$(resourceGroupName)" --location "$(azureLocation)" --only-show-errors
                      if ! az appservice plan show --name "$(appServicePlanName)" --resource-group "$(resourceGroupName)" >/dev/null 2>&1; then
                        az appservice plan create --name "$(appServicePlanName)" --resource-group "$(resourceGroupName)" --location "$(azureLocation)" --sku B1 --is-linux --only-show-errors
                      fi
                      if ! az webapp show --name "$(portalWebAppName)" --resource-group "$(resourceGroupName)" >/dev/null 2>&1; then
                        az webapp create --name "$(portalWebAppName)" --resource-group "$(resourceGroupName)" --plan "$(appServicePlanName)" --runtime "NODE:22-lts" --only-show-errors
                      fi
                      az webapp config set --name "$(portalWebAppName)" --resource-group "$(resourceGroupName)" --linux-fx-version "NODE|22-lts" --startup-file "pm2 serve /home/site/wwwroot --spa --no-daemon" --always-on true --ftps-state Disabled --min-tls-version 1.2 --only-show-errors

                - task: AzureCLI@2
                  displayName: Deploy portal zip
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az webapp deploy --resource-group "$(resourceGroupName)" --name "$(portalWebAppName)" --src-path "$(Pipeline.Workspace)/slh-tms-web/slh-tms-web.zip" --type zip --restart true --only-show-errors

                - script: |
                    set -euo pipefail
                    url="https://$(portalWebAppName).azurewebsites.net/"
                    for attempt in {1..24}; do
                      if curl --fail --silent --show-error "$url" > /tmp/portal.html; then
                        test -s /tmp/portal.html
                        grep -qi '<html' /tmp/portal.html
                        exit 0
                      fi
                      sleep 10
                    done
                    exit 1
                  displayName: Verify portal is serving
