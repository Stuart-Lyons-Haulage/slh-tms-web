name: Trigger auto deployment for slh-tms-portal-prod

# When this action will be executed
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Build and Lint Portal"]
    types: [completed]
    branches: [main]

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 5f07805f-dbc2-4068-8d2f-06569635fc0c
          tenant-id: 5aec48a1-c3c7-4cfd-a073-b38ae50041b1
          subscription-id: 29d5b52a-5b9f-4b5a-9495-892f1c2a30f3

      - name: Build and push the portal image in Azure Container Registry
        env:
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID || '5aec48a1-c3c7-4cfd-a073-b38ae50041b1' }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID || 'b4d086ae-6e9d-4578-8861-e61410127359' }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE || 'api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2/Tms.Access' }}
          VITE_AZURE_MAPS_CLIENT_ID: ${{ vars.VITE_AZURE_MAPS_CLIENT_ID || '58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c' }}
        run: |
          set -euo pipefail
          az acr build \
            --registry slhtmsacrprod \
            --image "slh-tms-portal-prod:${DEPLOY_SHA}" \
            --build-arg VITE_API_BASE_URL=/tms-api \
            --build-arg "VITE_ENTRA_TENANT_ID=$VITE_ENTRA_TENANT_ID" \
            --build-arg "VITE_ENTRA_CLIENT_ID=$VITE_ENTRA_CLIENT_ID" \
            --build-arg "VITE_ENTRA_API_SCOPE=$VITE_ENTRA_API_SCOPE" \
            --build-arg "VITE_AZURE_MAPS_CLIENT_ID=$VITE_AZURE_MAPS_CLIENT_ID" \
            .

      - name: Deploy the exact image revision
        run: |
          set -euo pipefail
          az containerapp update \
            --name slh-tms-portal-prod \
            --resource-group slh-tms-prod-rg \
            --image "slhtmsacrprod.azurecr.io/slh-tms-portal-prod:${DEPLOY_SHA}"

      - name: Verify portal revision is serving
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 10 \
              https://slh-tms-portal-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io/ || true)"
            if test "$status" = "200"; then exit 0; fi
            echo "Portal returned HTTP ${status}; retrying ($attempt/36)..."
            sleep 10
          done
          exit 1


