name: Trigger auto deployment for slh-tms-portal-prod

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/slh-tms-portal-prod-AutoDeployTrigger-9ef45802-17f2-425d-9502-8db65f35c937.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SLHTMSPORTALPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SLHTMSPORTALPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SLHTMSPORTALPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: slhtmsacrprod.azurecr.io
          registryUsername: ${{ secrets.SLHTMSPORTALPROD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SLHTMSPORTALPROD_REGISTRY_PASSWORD }}
          containerAppName: slh-tms-portal-prod
          resourceGroup: slh-tms-prod-rg
          imageToBuild: slhtmsacrprod.azurecr.io/slh-tms-portal-prod:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


