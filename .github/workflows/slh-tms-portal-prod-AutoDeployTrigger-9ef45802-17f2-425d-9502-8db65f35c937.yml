name: Trigger auto deployment for slh-tms-portal-prod

# Deploy only after the exact commit has passed the portal CI workflow.
# Keeping workflow_dispatch supports an intentional, manually selected deploy.
on:
  workflow_run:
    workflows: ["CI - Build, Test and E2E Portal"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify the deployed commit is the successful CI commit
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "${{ github.event.workflow_run.head_sha }}" = "$DEPLOY_SHA"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Stamp release marker
        run: |
          set -euo pipefail
          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > public/release.json

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 5f07805f-dbc2-4068-8d2f-06569635fc0c
          tenant-id: 5aec48a1-c3c7-4cfd-a073-b38ae50041b1
          subscription-id: 29d5b52a-5b9f-4b5a-9495-892f1c2a30f3

      - name: Build and push the portal image in Azure Container Registry
        env:
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID || '5aec48a1-c3c7-4cfd-a073-b38ae50041b1' }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID || 'b4d086ae-6e9d-4578-8861-e61410127359' }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE || 'api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2/Tms.Access' }}
          VITE_AZURE_MAPS_CLIENT_ID: ${{ vars.VITE_AZURE_MAPS_CLIENT_ID || '58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c' }}
        run: |
          set -euo pipefail
          az acr build \
            --registry slhtmsacrprod \
            --image "slh-tms-portal-prod:${DEPLOY_SHA}" \
            --build-arg VITE_API_BASE_URL=/tms-api \
            --build-arg "VITE_ENTRA_TENANT_ID=$VITE_ENTRA_TENANT_ID" \
            --build-arg "VITE_ENTRA_CLIENT_ID=$VITE_ENTRA_CLIENT_ID" \
            --build-arg "VITE_ENTRA_API_SCOPE=$VITE_ENTRA_API_SCOPE" \
            --build-arg "VITE_AZURE_MAPS_CLIENT_ID=$VITE_AZURE_MAPS_CLIENT_ID" \
            .

      - name: Deploy the exact image revision
        run: |
          set -euo pipefail
          az containerapp update \
            --name slh-tms-portal-prod \
            --resource-group slh-tms-prod-rg \
            --image "slhtmsacrprod.azurecr.io/slh-tms-portal-prod:${DEPLOY_SHA}"

      - name: Verify exact portal revision is ready and serving
        run: |
          set -euo pipefail
          expected_image="slhtmsacrprod.azurecr.io/slh-tms-portal-prod:${DEPLOY_SHA}"
          app_url="https://slh-tms-portal-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io"

          for attempt in {1..60}; do
            latest_revision="$(az containerapp show \
              --name slh-tms-portal-prod \
              --resource-group slh-tms-prod-rg \
              --query properties.latestRevisionName \
              --output tsv)"
            ready_revision="$(az containerapp show \
              --name slh-tms-portal-prod \
              --resource-group slh-tms-prod-rg \
              --query properties.latestReadyRevisionName \
              --output tsv)"
            revision_image="$(az containerapp revision show \
              --name slh-tms-portal-prod \
              --resource-group slh-tms-prod-rg \
              --revision "$latest_revision" \
              --query 'properties.template.containers[0].image' \
              --output tsv 2>/dev/null || true)"
            health_state="$(az containerapp revision show \
              --name slh-tms-portal-prod \
              --resource-group slh-tms-prod-rg \
              --revision "$latest_revision" \
              --query properties.healthState \
              --output tsv 2>/dev/null || true)"
            release_sha="$(curl --silent --fail --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "$app_url/release.json?ts=$(date +%s)" \
              | jq -r '.sha // empty' 2>/dev/null || true)"

            if test "$latest_revision" = "$ready_revision" \
              -a "$revision_image" = "$expected_image" \
              -a "$health_state" = "Healthy" \
              -a "$release_sha" = "$DEPLOY_SHA"; then
              echo "Verified $latest_revision is healthy and serving $DEPLOY_SHA."
              exit 0
            fi

            echo "Waiting for exact portal revision: latest=${latest_revision:-unknown}, ready=${ready_revision:-unknown}, health=${health_state:-unknown}, image=${revision_image:-unknown}, served=${release_sha:-unknown} ($attempt/60)"
            sleep 10
          done

          echo "::error::Portal did not serve the exact tested revision $DEPLOY_SHA."
          exit 1
