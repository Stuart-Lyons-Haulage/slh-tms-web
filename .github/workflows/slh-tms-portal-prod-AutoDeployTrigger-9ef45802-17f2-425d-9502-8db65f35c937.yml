name: Trigger auto deployment for slh-tms-portal-prod

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/slh-tms-portal-prod-AutoDeployTrigger-9ef45802-17f2-425d-9502-8db65f35c937.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 5f07805f-dbc2-4068-8d2f-06569635fc0c
          tenant-id: 5aec48a1-c3c7-4cfd-a073-b38ae50041b1
          subscription-id: 29d5b52a-5b9f-4b5a-9495-892f1c2a30f3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: slhtmsacrprod.azurecr.io
          username: ${{ secrets.SLHTMSPORTALPROD_REGISTRY_USERNAME }}
          password: ${{ secrets.SLHTMSPORTALPROD_REGISTRY_PASSWORD }}

      - name: Build and push the portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: slhtmsacrprod.azurecr.io/slh-tms-portal-prod:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/tms-api
            VITE_ENTRA_TENANT_ID=${{ vars.VITE_ENTRA_TENANT_ID || '5aec48a1-c3c7-4cfd-a073-b38ae50041b1' }}
            VITE_ENTRA_CLIENT_ID=${{ vars.VITE_ENTRA_CLIENT_ID || 'b4d086ae-6e9d-4578-8861-e61410127359' }}
            VITE_ENTRA_API_SCOPE=${{ vars.VITE_ENTRA_API_SCOPE || 'api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2/Tms.Access' }}
            VITE_AZURE_MAPS_CLIENT_ID=${{ vars.VITE_AZURE_MAPS_CLIENT_ID || '58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c' }}

      - name: Deploy the exact image revision
        run: az containerapp update --name slh-tms-portal-prod --resource-group slh-tms-prod-rg --image slhtmsacrprod.azurecr.io/slh-tms-portal-prod:${{ github.sha }}


