name: Trigger auto deployment for slh-tms-api-prod

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/slh-tms-api-prod-AutoDeployTrigger-7c494bc2-10ee-424f-8d09-0ed6d33fec47.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SLHTMSAPIPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SLHTMSAPIPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SLHTMSAPIPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: slhtmsacrprod.azurecr.io
          registryUsername: ${{ secrets.SLHTMSAPIPROD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SLHTMSAPIPROD_REGISTRY_PASSWORD }}
          containerAppName: slh-tms-api-prod
          resourceGroup: slh-tms-prod-rg
          imageToBuild: slhtmsacrprod.azurecr.io/slh-tms-api-prod:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


