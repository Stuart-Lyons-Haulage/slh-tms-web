name: Patch dispatch planning workbench

on:
  push:
    branches:
      - fix/dispatch-planning-workbench

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Turn Dispatch into an autosaving planning workbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dispatch-planning-workbench
          fetch-depth: 0
      - name: Apply Dispatch UI repair
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_dispatch.py
          python3 /tmp/patch_dispatch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DriverDispatch.tsx src/driver-dispatch.css src/pages/DriverDispatchPlanning.test.ts
          git commit -m "Turn Dispatch into an autosaving planning workbench"
          git push origin HEAD:fix/dispatch-planning-workbench
