name: Phase 2 selector repair

on:
  push:
    branches:
      - feature/frontend-hardening-e2e

permissions:
  contents: write

jobs:
  repair-dispatch-filter-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frontend-hardening-e2e
      - name: Make run filter distinct from assignment control
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/DriverDispatch.tsx')
          text = path.read_text()
          old = '  run: "Run…",\n'
          new = '  run: "Filter runs…",\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected Driver Dispatch run filter label was not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit repair once
        run: |
          git config user.name 'danwilliams201302-max'
          git config user.email 'daniel@lyonshaulage.com'
          git add src/pages/DriverDispatch.tsx
          if git diff --cached --quiet; then
            echo 'Selector repair already applied.'
            exit 0
          fi
          git commit -m 'Disambiguate dispatch run filter'
          git push origin HEAD:feature/frontend-hardening-e2e
