name: Runtime patch inventory

on:
  push:
    branches: ['feature/eliminate-runtime-patches']
    paths:
      - .github/workflows/refactor-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eliminate-runtime-patches
      - name: Inventory patch architecture
        shell: bash
        run: |
          echo '=== REMAINING PATCH FILES ==='
          find src -maxdepth 2 -type f \( -name '*Patch.ts' -o -name '*Patch.tsx' -o -name '*Bridge.ts' \) -print | sort || true
          echo '=== PATCH IMPORTS ==='
          grep -RInE "(Patch|Bridge)['\"]|from ['\"][^'\"]*(Patch|Bridge)" src --include='*.ts' --include='*.tsx' || true
          echo '=== LEGACY LOAD API USAGE ==='
          grep -RInE "api\.(loads|createLoad|allocateLoad|updateLoadStatus|updateLoadStops|updateLoadUtilisation|route|dispatch)|/api/v1/loads" src --include='*.ts' --include='*.tsx' || true
          echo '=== GLOBAL MONKEY PATCHES ==='
          grep -RInE "window\.fetch\s*=|Response\.prototype\.json|MutationObserver|window\.setInterval\s*=" src --include='*.ts' --include='*.tsx' || true
          echo '=== PATCHED ENDPOINT/FEATURE REFERENCES ==='
          grep -RInE "syncFleetioVehicles|management/summary|management/resilient-summary|operations/readiness-snapshot|runs/readiness|master-data-cleanup|geofence-recovery|run-progress|driver-dispatch|maps/geocode|commercial" src --include='*.ts' --include='*.tsx' || true
