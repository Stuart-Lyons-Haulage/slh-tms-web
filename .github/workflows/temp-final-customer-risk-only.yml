name: Temporary final customer risk guard

on:
  push:
    branches: [ fix/wallboard-final-risk-tv-sync-20260828 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallboard-final-risk-tv-sync-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restrict hard ETA risk to final customer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/operationsWallboardProgress.ts')
          text = path.read_text()
          old = '''  const hardCustomerRisk = etas.find((eta) => eta.source === "Live" && eta.risk === "Late" && eta.deliveryWindowEndUtc);
            if (hardCustomerRisk) {
              return {
                status: "late",
                label: "LATE DELIVERY ETA",
                detail: `${hardCustomerRisk.stopName} will miss its customer window`,
                priority: 94,
              };
            }
          '''
          new = '''  // Intermediate milestones can be behind plan without making the run late. The
            // cumulative final-customer assessment above is the only delivery-promise risk.
          '''
          if old not in text:
              raise SystemExit('hardCustomerRisk block not found')
          path.write_text(text.replace(old, new, 1))

          tests = Path('src/pages/operationsWallboardProgress.test.ts')
          text = tests.read_text()
          addition = '''

            it("does not colour the run late when only an intermediate live milestone is late", () => {
              const etas = [
                eta({ stopId: "mid", sequence: 2, stopName: "Deliver · Aldi-Darlington", etaUtc: "2026-08-28T15:00:00Z", deliveryWindowEndUtc: "2026-08-28T10:00:00Z", risk: "Late", source: "Live" }),
                eta({ stopId: "final", sequence: 5, stopName: "Deliver · Morrisons-Stockton", etaUtc: "2026-08-28T15:29:00Z", source: "Estimated" }),
              ];

              const result = statusFor(progress(), etas[0], etas, Date.parse("2026-08-28T11:20:00Z"), "2026-08-28T18:00:00Z");

              expect(result.status).toBe("route");
              expect(result.label).toBe("ON ROUTE");
            });
          '''
          if 'does not colour the run late when only an intermediate live milestone is late' not in text:
              pos = text.rfind('\n});')
              if pos < 0: raise SystemExit('test closing block not found')
              text = text[:pos] + addition + text[pos:]
          tests.write_text(text)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-final-customer-risk-only.yml
          git add src/pages/operationsWallboardProgress.ts src/pages/operationsWallboardProgress.test.ts
          git commit -m "Use final customer ETA as run risk authority"
          git push origin HEAD:fix/wallboard-final-risk-tv-sync-20260828
