name: Temporary wallboard TV synchronisation repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary_wallboard_sync_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply wallboard synchronisation and TV layout repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = """  const tvContent = location.pathname === '/tv'\n    ? <PublicTvBoard />\n    : authenticated || hasTvAccessKey\n      ? <RouteErrorBoundary key={location.pathname + location.search}><OperationsWallboard tvMode /></RouteErrorBoundary>\n      : <section className=\"sign-in-panel\"><p className=\"eyebrow\">Secure operations wallboard</p><h1>Open the office wallboard</h1><p>Use the dedicated TV access link, or sign in with a Lyons Microsoft account.</p><button className=\"primary\" onClick={signIn} disabled={!apiScope}>Sign in with Microsoft</button></section>;"""
          new = """  // Every TV route must use the same public wallboard adapter. This keeps legacy\n  // /operations-wallboard/tv and /live-runs/tv links on the exact same data path,\n  // key handling and rendering logic as /tv instead of allowing two TV variants.\n  const tvContent = <PublicTvBoard />;"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected TV content block was not found')
          app.write_text(text)

          css = Path('src/operations-wallboard.css')
          text = css.read_text()
          text = text.replace('grid-template-columns: repeat(5, minmax(0, 1fr));', 'grid-template-columns: repeat(6, minmax(0, 1fr));', 1)
          marker = '/* TV wallboard stability repair 2026-08-28 */'
          if marker not in text:
              text += '''\n\n/* TV wallboard stability repair 2026-08-28 */\n.ops-wallboard.tv {\n  height: 100dvh;\n  min-height: 0;\n  max-height: 100dvh;\n}\n\n.ops-wallboard.tv .ops-wallboard-summary {\n  grid-template-columns: repeat(6, minmax(0, 1fr));\n}\n\n.ops-board-row.onsite .status-cell strong {\n  color: #75d5ff;\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n}\n\n.ops-board-row.onsite .status-cell strong::before {\n  content: \"\";\n  width: 10px;\n  height: 10px;\n  border-radius: 999px;\n  background: #75d5ff;\n  box-shadow: 0 0 0 3px rgba(117, 213, 255, 0.16);\n  flex: 0 0 auto;\n}\n'''
          css.write_text(text)
          PY

      - name: Verify frontend
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/operations-wallboard.css
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git commit -m "Unify TV wallboard and fix live status layout"
          git push origin HEAD:main
