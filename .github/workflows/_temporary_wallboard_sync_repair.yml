name: Temporary wallboard TV synchronisation repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary_wallboard_sync_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical TV wallboard repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace("  const hasTvAccessKey = tvMode && new URLSearchParams(location.search).has('key');\n", "", 1)
          old = """  const tvContent = location.pathname === '/tv'\n    ? <PublicTvBoard />\n    : authenticated || hasTvAccessKey\n      ? <RouteErrorBoundary key={location.pathname + location.search}><OperationsWallboard tvMode /></RouteErrorBoundary>\n      : <section className=\"sign-in-panel\"><p className=\"eyebrow\">Secure operations wallboard</p><h1>Open the office wallboard</h1><p>Use the dedicated TV access link, or sign in with a Lyons Microsoft account.</p><button className=\"primary\" onClick={signIn} disabled={!apiScope}>Sign in with Microsoft</button></section>;"""
          new = """  // All TV entry points use the paired public board so the office TV and the\n  // signed-in wallboard share one renderer, one status model and one ETA feed.\n  const tvContent = <PublicTvBoard />;"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected TV content block was not found')
          app.write_text(text)

          index = Path('index.html')
          index.write_text('''<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8" />\n  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />\n  <meta name="theme-color" content="#063b5c" />\n  <meta name="apple-mobile-web-app-capable" content="yes" />\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n  <meta name="apple-mobile-web-app-title" content="SLH TMS" />\n  <link rel="manifest" href="/manifest.json" />\n  <link rel="apple-touch-icon" href="/icon-192.png" />\n  <title>SLH Transport Management</title>\n</head>\n<body>\n  <div id="root"></div>\n  <script type="module" src="/src/main.tsx"></script>\n  <script>\n    if ('serviceWorker' in navigator) {\n      window.addEventListener('load', function () {\n        navigator.serviceWorker.register('/sw.js').catch(function () {});\n      });\n    }\n  </script>\n</body>\n</html>\n''')

          css = Path('src/operations-wallboard.css')
          text = css.read_text()
          text = text.replace('grid-template-columns: repeat(5, minmax(0, 1fr));', 'grid-template-columns: repeat(6, minmax(0, 1fr));', 1)
          marker = '/* Canonical TV wallboard repair 2026-08-28 */'
          if marker not in text:
              text += '''\n\n/* Canonical TV wallboard repair 2026-08-28 */\n.ops-wallboard.tv {\n  height: 100vh;\n  min-height: 100vh;\n  max-height: 100vh;\n}\n\n.ops-wallboard.tv .ops-wallboard-summary {\n  grid-template-columns: repeat(6, minmax(0, 1fr));\n}\n\n.ops-wallboard.tv .ops-board-table {\n  scrollbar-gutter: stable;\n}\n\n.ops-wallboard-summary article:nth-child(3) {\n  border-left-color: #75d5ff;\n}\n\n.ops-board-row.onsite .status-cell strong {\n  color: #75d5ff;\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n}\n\n.ops-board-row.onsite .status-cell strong::before {\n  content: \"\";\n  width: 10px;\n  height: 10px;\n  border-radius: 999px;\n  background: #75d5ff;\n  box-shadow: 0 0 0 3px rgba(117, 213, 255, 0.16);\n  flex: 0 0 auto;\n}\n'''
          css.write_text(text)

          sw = Path('public/sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE_NAME = 'slh-tms-v3';", "const CACHE_NAME = 'slh-tms-v4';", 1)
          sw.write_text(text)
          PY

      - name: Verify frontend
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx index.html src/operations-wallboard.css public/sw.js
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git commit -m "Unify TV wallboard and stabilise live status display"
          git push origin HEAD:main
