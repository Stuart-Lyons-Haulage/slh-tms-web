name: Phase 2 allocation filter repair

on:
  push:
    branches:
      - feature/frontend-hardening-e2e

permissions:
  contents: write

jobs:
  repair-allocation-filter-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frontend-hardening-e2e
      - name: Distinguish filters from allocation controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/DriverDispatch.tsx')
          text = path.read_text()
          replacements = {
              '  vehicle: "Vehicle…",\n': '  vehicle: "Filter vehicles…",\n',
              '  trailer: "Trailer…",\n': '  trailer: "Filter trailers…",\n',
          }
          changed = False
          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected Driver Dispatch filter label was not found: {old!r}')
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              path.write_text(text)
          PY
      - name: Commit repair once
        run: |
          git config user.name 'danwilliams201302-max'
          git config user.email 'daniel@lyonshaulage.com'
          git add src/pages/DriverDispatch.tsx
          if git diff --cached --quiet; then
            echo 'Allocation filter repair already applied.'
            exit 0
          fi
          git commit -m 'Disambiguate dispatch allocation filters'
          git push origin HEAD:feature/frontend-hardening-e2e
