name: Refactor lint fix

on:
  push:
    branches: ['feature/eliminate-runtime-patches']
    paths: ['.github/workflows/refactor-lint-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eliminate-runtime-patches
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/RunPlanningIntelligence.tsx')
          text = path.read_text()
          text = re.sub(r'\s*const empty = loc\?\.latitude.*?: undefined;\n', '\n', text)
          text = re.sub(r'\n  const vehicles = useMemo\(\(\) => \{.*?\n  const chosenVehicle = .*?;\n', '\n', text, flags=re.S)
          path.write_text(text)

          path = Path('src/pages/DriverDispatch.tsx')
          text = path.read_text().replace('import { api, request, type LoadDispatch, type Trailer, type Vehicle } from "../lib/api";', 'import { request, type LoadDispatch, type Trailer, type Vehicle } from "../lib/api";')
          text = re.sub(r'\nfunction addDays\([^\n]+\n', '\n', text)
          path.write_text(text)

          path = Path('src/pages/ImportedPlanRuns.tsx')
          text = path.read_text().replace('import { api, request,', 'import { request,')
          path.write_text(text)

          for filename in ['src/pages/OperationalPlanner.tsx', 'src/pages/PlannerV2.tsx', 'src/pages/PlannerV3.tsx']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('createRun, ', '').replace(', createRun', '')
              path.write_text(text)
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix refactor lint findings"
          git pull --rebase origin feature/eliminate-runtime-patches
          git push origin HEAD:feature/eliminate-runtime-patches
