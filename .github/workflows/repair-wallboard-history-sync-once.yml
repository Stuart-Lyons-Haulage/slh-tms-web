name: Repair wallboard history sync once

on:
  push:
    branches:
      - fix/wallboard-history-sync-20260828
    paths:
      - .github/workflows/repair-wallboard-history-sync-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallboard-history-sync-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply canonical wallboard repair
        run: python3 -c "import zlib,base64;exec(zlib.decompress(base64.b64decode('')))"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
        env:
          VITE_API_BASE_URL: http://localhost:5173
          VITE_ENTRA_TENANT_ID: test
          VITE_ENTRA_CLIENT_ID: test
          VITE_ENTRA_API_SCOPE: api://test/Tms.Access
          VITE_AZURE_MAPS_CLIENT_ID: test
      - name: Commit repaired wallboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-wallboard-history-sync-once.yml
          git add src/pages/operationsWallboardProgress.ts src/pages/OperationsWallboardLive.tsx src/pages/operationsWallboardProgress.test.ts src/pages/OperationsWallboard.test.ts src/operations-wallboard.css src/App.tsx
          git commit -m "Synchronise wallboard history and final ETA status"
          git push origin HEAD:fix/wallboard-history-sync-20260828
