name: Validate patch elimination refactor

on:
  push:
    branches: ['feature/eliminate-runtime-patches']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Confirm runtime patches are gone
        shell: bash
        run: |
          test ! -f src/runtimeGuards.ts
          test ! -f src/allocationResiliencePatch.ts
          response_patch='Response'"\\.prototype\\.json"
          ! grep -RInE "$response_patch" src --include='*.ts' --include='*.tsx'
          ! grep -RInE 'api\.(loads|createLoad|allocateLoad|updateLoadStatus|updateLoadStops|updateLoadUtilisation|route|dispatch)\(' src --include='*.ts' --include='*.tsx'
          ! find src -maxdepth 1 -type f -name '*Patch.ts' | grep .
