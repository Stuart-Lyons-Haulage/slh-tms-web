name: CI - Build, Test and E2E Portal

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-strict-fixes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/frontend-hardening-e2e'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/frontend-hardening-e2e
      - name: Apply guarded fixes
        run: python scripts/finish-strict-contract-fixes.py
      - name: Commit repaired pages
        run: |
          git config user.name 'danwilliams201302-max'
          git config user.email 'daniel@lyonshaulage.com'
          git add src/pages
          if git diff --cached --quiet; then
            echo 'No page repairs required.'
            exit 0
          fi
          git commit -m 'Finish strict frontend contract reconciliation'
          git push origin HEAD:feature/frontend-hardening-e2e

  build:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/feature/frontend-hardening-e2e'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint portal
        run: pnpm lint
      - name: Typecheck portal
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Build portal
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run workflow E2E test
        run: pnpm test:e2e
      - name: Enforce patch-free runtime
        run: |
          ! grep -R "Response.prototype.json" src
          ! grep -R "window.fetch =" src
          test ! -f src/runtimeGuards.ts
          test ! -f src/allocationResiliencePatch.ts
