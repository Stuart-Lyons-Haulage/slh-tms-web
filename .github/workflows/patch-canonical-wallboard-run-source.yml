name: Patch canonical wallboard run source

on:
  push:
    branches:
      - fix/canonical-wallboard-run-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-wallboard-run-source
      - name: Patch sources and remove temporary workflow
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use canonical runs across dashboard and wallboards'
          git push origin HEAD:fix/canonical-wallboard-run-source
