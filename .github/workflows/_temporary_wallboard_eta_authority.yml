name: Temporary wallboard ETA authority repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary_wallboard_eta_authority.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make server ETA snapshots authoritative
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/OperationsWallboardLive.tsx')
          text = path.read_text()

          old = '''function mergeEtaSnapshots(previous: DeliveryEta[], incoming: DeliveryEta[]) {
            if (!incoming.length) return previous;
            const merged = new Map(previous.map(eta => [`${eta.loadId}|${eta.sequence}`, eta]));
            for (const eta of incoming) merged.set(`${eta.loadId}|${eta.sequence}`, eta);
            return [...merged.values()];
          }'''
          old = old.replace('          ', '')
          new = '''function mergeEtaSnapshots(previous: DeliveryEta[], incoming: DeliveryEta[]) {
            // A fulfilled ETA response is a complete canonical server snapshot for this
            // operating date. Do not merge it with browser-local records from an older
            // refresh, otherwise the TV and signed-in wallboard can retain different ETAs.
            return incoming.length ? incoming : previous;
          }'''.replace('          ', '')
          assert old in text, 'mergeEtaSnapshots block not found'
          text = text.replace(old, new)

          old_deadline = 'const finalDeadlineUtc = finalEta?.deliveryWindowEndUtc || finalDestinationStop(load)?.plannedArrivalUtc;'
          new_deadline = 'const finalDeadlineUtc = finalEta?.deliveryWindowEndUtc;'
          assert old_deadline in text, 'final deadline fallback not found'
          text = text.replace(old_deadline, new_deadline)

          old_buffer = 'const buffer = minutesToWindow(row.nextEta);'
          new_buffer = 'const buffer = minutesToWindow(row.finalEta);'
          assert old_buffer in text, 'status buffer source not found'
          text = text.replace(old_buffer, new_buffer)

          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/_temporary_wallboard_eta_authority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OperationsWallboardLive.tsx .github/workflows/_temporary_wallboard_eta_authority.yml
          git commit -m 'Use canonical server ETA snapshot on TV and TMS'
          git push origin HEAD:main
