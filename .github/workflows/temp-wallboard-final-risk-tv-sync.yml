name: Temporary wallboard final-risk and TV sync repair

on:
  push:
    branches: [ fix/wallboard-final-risk-tv-sync-20260828 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallboard-final-risk-tv-sync-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply wallboard corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          progress = Path('src/pages/operationsWallboardProgress.ts')
          text = progress.read_text()
          old = '''function finalDeliveryAssessment(etas: DeliveryEta[]): FinalDeliveryAssessment {
            const finalEta = finalEtaFor(etas);
            const etaMs = timeMs(finalEta?.etaUtc);
            const deadlineMs = timeMs(finalEta?.deliveryWindowEndUtc);
            if (!Number.isFinite(etaMs) || !Number.isFinite(deadlineMs)) return { onTime: false };

            const bufferMinutes = Math.floor((deadlineMs - etaMs) / 60000);
            const stopName = finalEta?.stopName || "Final delivery";
            if (bufferMinutes < 0) {
              const estimated = finalEta?.source === "Estimated";
              return {
                onTime: false,
                bufferMinutes,
                result: {
                  status: estimated ? "risk" : "late",
                  label: estimated ? "FINAL ETA AT RISK" : "LATE FINAL ETA",
                  detail: `${stopName} final ETA is ${Math.abs(bufferMinutes)}m after delivery latest time`,
                  priority: estimated ? 89 : 96,
                },
              };
            }
            if (bufferMinutes <= RISK_BUFFER_MINUTES) {
              return {
                onTime: false,
                bufferMinutes,
                result: {
                  status: "risk",
                  label: "FINAL ETA AT RISK",
                  detail: `${stopName} has ${bufferMinutes}m buffer to delivery latest time`,
                  priority: 88,
                },
              };
            }
            return { onTime: true, bufferMinutes };
          }'''
          new = '''function finalDeliveryAssessment(etas: DeliveryEta[], finalDeadlineUtc?: string): FinalDeliveryAssessment {
            const finalEta = finalEtaFor(etas);
            const etaMs = timeMs(finalEta?.etaUtc);
            if (!Number.isFinite(etaMs)) return { onTime: false };

            // Customer risk is assessed only against the final customer promise. Prefer the
            // order's latest delivery-window time; when the order has no explicit window,
            // the final planned customer-stop time is the operational deadline.
            const deadlineMs = timeMs(finalEta?.deliveryWindowEndUtc || finalDeadlineUtc);
            if (!Number.isFinite(deadlineMs)) {
              // A valid cumulative final ETA must not turn the whole run amber merely because
              // an intermediate collection/delivery milestone is behind its planning time.
              return { onTime: true };
            }

            const bufferMinutes = Math.floor((deadlineMs - etaMs) / 60000);
            const stopName = finalEta?.stopName || "Final delivery";
            if (bufferMinutes < 0) {
              const estimated = finalEta?.source === "Estimated";
              return {
                onTime: false,
                bufferMinutes,
                result: {
                  status: estimated ? "risk" : "late",
                  label: estimated ? "FINAL ETA AT RISK" : "LATE FINAL ETA",
                  detail: `${stopName} final ETA is ${Math.abs(bufferMinutes)}m after delivery latest time`,
                  priority: estimated ? 89 : 96,
                },
              };
            }

            // The requested operating rule is binary at the final customer deadline: an ETA
            // before/on the last accepted time remains on route; an ETA beyond it is risk/late.
            return { onTime: true, bufferMinutes };
          }'''
          if old not in text:
              raise SystemExit('finalDeliveryAssessment source block not found')
          text = text.replace(old, new)
          old_sig = 'export function statusFor(progress: RunProgressRecord | undefined, nextEta: DeliveryEta | undefined, etas: DeliveryEta[], nowMs = Date.now()): WallboardStatusResult {'
          new_sig = 'export function statusFor(progress: RunProgressRecord | undefined, nextEta: DeliveryEta | undefined, etas: DeliveryEta[], nowMs = Date.now(), finalDeadlineUtc?: string): WallboardStatusResult {'
          if old_sig not in text:
              raise SystemExit('statusFor signature not found')
          text = text.replace(old_sig, new_sig)
          old_call = '  const finalAssessment = finalDeliveryAssessment(etas);'
          new_call = '  const finalAssessment = finalDeliveryAssessment(etas, finalDeadlineUtc);'
          if old_call not in text:
              raise SystemExit('finalDeliveryAssessment call not found')
          text = text.replace(old_call, new_call, 1)
          progress.write_text(text)

          live = Path('src/pages/OperationsWallboardLive.tsx')
          text = live.read_text()
          old = '''      const nextEta = pickNextEta(etas, progress);
                const finalEta = finalEtaFor(etas);
                const status = statusFor(progress, nextEta, etas);'''
          new = '''      const nextEta = pickNextEta(etas, progress);
                const finalEta = finalEtaFor(etas);
                const finalDeadlineUtc = finalEta?.deliveryWindowEndUtc || finalDestinationStop(load)?.plannedArrivalUtc;
                const status = statusFor(progress, nextEta, etas, Date.now(), finalDeadlineUtc);'''
          if old not in text:
              raise SystemExit('wallboard status source block not found')
          text = text.replace(old, new)
          old_scroll = '''    window.setTimeout(() => tableRef.current?.querySelector<HTMLElement>(`[data-row-id="${presentRowId}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" }), 350);'''
          new_scroll = '''    window.setTimeout(() => {
                const table = tableRef.current;
                const target = table?.querySelector<HTMLElement>(`[data-row-id="${presentRowId}"]`);
                if (!table || !target) return;
                const top = target.offsetTop - Math.max(0, (table.clientHeight - target.clientHeight) / 2);
                table.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
              }, 350);'''
          if old_scroll not in text:
              raise SystemExit('TV auto-scroll source block not found')
          text = text.replace(old_scroll, new_scroll)
          live.write_text(text)

          css = Path('src/operations-wallboard.css')
          text = css.read_text()
          marker = '/* TV viewport stability: never let the seven-column board widen the physical display. */'
          if marker not in text:
              text += '''\n\n/* TV viewport stability: never let the seven-column board widen the physical display. */
          .ops-wallboard.tv {
            width: 100vw;
            max-width: 100vw;
            box-sizing: border-box;
            overflow-x: hidden;
          }

          .ops-wallboard.tv .ops-board-table {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
          }

          .ops-wallboard.tv .ops-board-head,
          .ops-wallboard.tv .ops-board-row {
            width: 100%;
            min-width: 0;
            grid-template-columns: minmax(0,.62fr) minmax(0,.95fr) minmax(0,.66fr) minmax(0,.88fr) minmax(0,1.72fr) minmax(0,.72fr) minmax(0,1.05fr);
          }

          .ops-wallboard.tv .ops-board-head > span,
          .ops-wallboard.tv .ops-board-row > span {
            min-width: 0;
          }

          /* The TV is a live control surface, not a report: remove the decorative bottom strip. */
          .ops-wallboard.tv .ops-wallboard-footer,
          .tv-public-mode .tv-display-footer {
            display: none !important;
          }
          '''
          css.write_text(text)

          tests = Path('src/pages/operationsWallboardProgress.test.ts')
          text = tests.read_text()
          addition = '''

            it("keeps a run on route when the cumulative final ETA is before the final planned customer deadline", () => {
              const current = progress();
              current.nextStop = {
                id: "aldi",
                sequence: 3,
                name: "Deliver · Aldi-Darlington",
                plannedArrivalUtc: "2026-08-28T10:00:00Z",
              };
              const etas = [
                eta({ stopId: "aldi", sequence: 3, stopName: "Deliver · Aldi-Darlington", etaUtc: "2026-08-28T15:00:00Z" }),
                eta({ stopId: "final", sequence: 5, stopName: "Deliver · Morrisons-Stockton", etaUtc: "2026-08-28T15:29:00Z", source: "Estimated" }),
              ];

              const result = statusFor(current, etas[0], etas, Date.parse("2026-08-28T11:20:00Z"), "2026-08-28T18:00:00Z");

              expect(result.status).toBe("route");
              expect(result.label).toBe("ON ROUTE");
            });

            it("flags an estimated final ETA only after it passes the final customer deadline", () => {
              const etas = [
                eta({ stopId: "final", sequence: 5, stopName: "Deliver · Morrisons-Stockton", etaUtc: "2026-08-28T18:05:00Z", source: "Estimated" }),
              ];

              const result = statusFor(progress(), etas[0], etas, Date.parse("2026-08-28T11:20:00Z"), "2026-08-28T18:00:00Z");

              expect(result.status).toBe("risk");
              expect(result.label).toBe("FINAL ETA AT RISK");
            });

            it("does not mark a final ETA at or before the deadline as risk just for having a small buffer", () => {
              const etas = [
                eta({ stopId: "final", sequence: 5, stopName: "Deliver · Morrisons-Stockton", etaUtc: "2026-08-28T17:59:00Z", source: "Live" }),
              ];

              const result = statusFor(progress(), etas[0], etas, Date.parse("2026-08-28T11:20:00Z"), "2026-08-28T18:00:00Z");

              expect(result.status).toBe("route");
              expect(result.label).toBe("ON ROUTE");
            });
          '''
          if 'keeps a run on route when the cumulative final ETA is before the final planned customer deadline' not in text:
              pos = text.rfind('\n});')
              if pos < 0:
                  raise SystemExit('test describe closing block not found')
              text = text[:pos] + addition + text[pos:]
          tests.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit repaired source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-wallboard-final-risk-tv-sync.yml
          git add src/pages/operationsWallboardProgress.ts src/pages/OperationsWallboardLive.tsx src/pages/operationsWallboardProgress.test.ts src/operations-wallboard.css
          git commit -m "Align final ETA risk and stabilise TV wallboard"
          git push origin HEAD:fix/wallboard-final-risk-tv-sync-20260828
