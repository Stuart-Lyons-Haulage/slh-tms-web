name: Finish patch cleanup

on:
  push:
    branches: ['feature/eliminate-runtime-patches']
    paths:
      - .github/workflows/finish-patch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eliminate-runtime-patches
          fetch-depth: 0
      - name: Fold compatibility behaviour into owning modules
        shell: python
        run: |
          from pathlib import Path

          api = Path('src/lib/api.ts')
          text = api.read_text()
          marker = '/* eslint-disable @typescript-eslint/no-explicit-any */\n'
          imports = "import { geocode as geocodeAddress } from '../api/maps';\nimport { normaliseMarketContacts, normaliseMarketMasterRecords } from '../api/market';\n"
          if imports not in text:
              text = text.replace(marker, marker + imports)
          text = text.replace("marketContacts: (token?: string) => request<MarketContact[]>('/api/v1/market-contacts', token),", "marketContacts: async (token?: string) => normaliseMarketContacts(await request<MarketContact[]>('/api/v1/market-contacts', token)),")
          text = text.replace("stageBatch: (records: StageBatchRequest[], token?: string) => request<StageBatchResponse>('/api/v1/staging/batch', token, { method: 'POST', body: JSON.stringify(records) }),", "stageBatch: (records: StageBatchRequest[], token?: string) => request<StageBatchResponse>('/api/v1/staging/batch', token, { method: 'POST', body: JSON.stringify(normaliseMarketMasterRecords(records)) }),")
          text = text.replace("applyMasterData: (records: StageBatchRequest[], token?: string) => request<MasterApplyResponse>('/api/v1/master-data/apply', token, { method: 'POST', body: JSON.stringify(records) }),", "applyMasterData: (records: StageBatchRequest[], token?: string) => request<MasterApplyResponse>('/api/v1/master-data/apply', token, { method: 'POST', body: JSON.stringify(normaliseMarketMasterRecords(records)) }),")
          import re
          text = re.sub(r"\n  loads: .*?\n", "\n", text)
          text = re.sub(r"\n  createLoad: .*?\n", "\n", text)
          text = re.sub(r"\n  allocateLoad: .*?\n", "\n", text)
          text = re.sub(r"\n  updateLoadStatus: .*?\n", "\n", text)
          text = re.sub(r"\n  updateLoadStops: .*?\n", "\n", text)
          text = re.sub(r"\n  updateLoadUtilisation: .*?\n", "\n", text)
          text = re.sub(r"\n  route: .*?\n", "\n", text)
          text = re.sub(r"\n  dispatch: .*?\n", "\n", text)
          text = re.sub(r"  geocode: \(address: string, token\?: string\) => request<Record<string, unknown>>\(`/api/v1/maps/geocode\?address=\$\{encodeURIComponent\(address\)\}`, token\),", "  geocode: (address: string, token?: string) => geocodeAddress(address, token),", text)
          text = text.replace("'/api/v1/integrations/fleetio/sync-vehicles'", "'/api/v1/integrations/fleetio/sync-assets-resilient'")
          api.write_text(text)

          dispatch = Path('src/pages/DriverDispatch.tsx')
          text = dispatch.read_text()
          text = text.replace('  const readOnly = initialParams.get("compare") === "1";\n', '  const readOnly = false;\n')
          text = text.replace('  const yesterday = () => window.open(`/driver-dispatch?date=${encodeURIComponent(addDays(date, -1))}&compare=1`, "_blank", "noopener,noreferrer");\n\n', '')
          text = text.replace('        <button type="button" onClick={yesterday}>Open yesterday in new screen ↗</button>\n', '')
          dispatch.write_text(text)

          intelligence = Path('src/components/RunPlanningIntelligence.tsx')
          if intelligence.exists():
              lines = intelligence.read_text().splitlines()
              lines = [line for line in lines if '/commercial' not in line and 'estimatedEmptyMiles' not in line]
              intelligence.write_text('\n'.join(lines) + '\n')

          geo = Path('src/pages/GeofenceOperational.tsx')
          text = geo.read_text()
          text = text.replace("import { useCallback, useEffect, useMemo, useState } from 'react';", "import { useCallback, useEffect, useMemo, useRef, useState } from 'react';")
          text = text.replace("import { installGeofenceSiteStatusFallback } from '../geofenceRefreshPolicy';\n", '')
          old = "\n\n  // Install the site-status fetch fallback for the duration this screen is mounted.\n  // The cleanup function returned by installGeofenceSiteStatusFallback() restores\n  // window.fetch on unmount, preventing interceptor stacking across remounts.\n  useEffect(() => installGeofenceSiteStatusFallback(), []);\n\n"
          text = text.replace(old, "\n  const lastGoodSites = useRef<SiteOption[]>([]);\n\n")
          text = text.replace("        request<SiteOption[]>('/api/v1/site-geofence-sync/sites', access),", "        request<SiteOption[]>('/api/v1/site-geofence-sync/sites', access).then(rows => { lastGoodSites.current = rows; return rows; }).catch(() => lastGoodSites.current),")
          target = "  useEffect(() => { void load(); }, [load]);\n"
          replacement = target + "  useEffect(() => {\n    const refreshIfVisible = () => { if (document.visibilityState === 'visible') void load(); };\n    const interval = window.setInterval(refreshIfVisible, 30_000);\n    window.addEventListener('focus', refreshIfVisible);\n    document.addEventListener('visibilitychange', refreshIfVisible);\n    return () => { window.clearInterval(interval); window.removeEventListener('focus', refreshIfVisible); document.removeEventListener('visibilitychange', refreshIfVisible); };\n  }, [load]);\n"
          if 'window.setInterval(refreshIfVisible' not in text:
              text = text.replace(target, replacement)
          geo.write_text(text)

          obsolete = [
            'src/automaticRefreshPresentationPatch.ts',
            'src/commercialRemovalPatch.ts',
            'src/driverDispatchComparisonRemovalPatch.ts',
            'src/fleetioSyncPatch.ts',
            'src/geofenceRecoveryPatch.ts',
            'src/geofenceRefreshPolicy.ts',
            'src/liveVehiclePopupPatch.ts',
            'src/managementFallbackPatch.ts',
            'src/marketNormalizationPatch.ts',
            'src/masterDataCleanupFetchPatch.ts',
            'src/operationalPresentationPatch.ts',
            'src/overnightWallboardFetchPatch.ts',
            'src/routeGeocodeFallbackPatch.ts',
            'src/typeaheadLookupPatch.ts',
            'src/wallboardSnapshotFetchPatch.ts',
          ]
          for item in obsolete:
              Path(item).unlink(missing_ok=True)
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- src; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src
          git commit -m "Fold runtime patch behaviour into owning modules"
          git pull --rebase origin feature/eliminate-runtime-patches
          git push origin HEAD:feature/eliminate-runtime-patches
