name: Refresh feature lockfile

on:
  push:
    branches: ['feature/eliminate-runtime-patches']
    paths:
      - package.json
      - .github/workflows/refresh-feature-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eliminate-runtime-patches
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update pnpm lockfile for Zod"
          git push
