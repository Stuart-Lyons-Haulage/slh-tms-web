<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SLH Live Operations</title>
  <script>
    // The physical TV and the signed-in TMS must render the same OperationsWallboard
    // component so driver/vehicle allocation, geofence progression and final ETA cannot
    // drift between two separate browser implementations. Preserve the paired display key.
    window.location.replace('/tv' + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <noscript>JavaScript is required for the SLH live operations wallboard.</noscript>
</body>
</html>
