<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

  <title>SLH Live Operations</title>
  <link rel="stylesheet" href="/tv-wallboard-v2.css?v=20260909-proven-v3-geofence-current">
</head>
<body>
  <div id="root"></div>
  <script>
    // Keep the proven TV runtime/geofence logic unchanged, but reduce its heavy
    // live data poll from 20 seconds to 5 minutes. Clock, page rotation and the
    // 30-minute hard reload retain their existing independent intervals.
    (function () {
      var nativeSetInterval = window.setInterval.bind(window);
      window.setInterval = function (handler, delay) {
        var args = Array.prototype.slice.call(arguments, 2);
        var effectiveDelay = Number(delay) === 20000 ? 5 * 60 * 1000 : delay;
        return nativeSetInterval.apply(window, [handler, effectiveDelay].concat(args));
      };
    }());
  </script>
  <script src="/tv-wallboard-v3.js?v=20260909-proven-v3-geofence-current"></script>
</body>
</html>
