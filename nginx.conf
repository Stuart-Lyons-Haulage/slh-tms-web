server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /tms-api/ {
    proxy_pass https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io;
    proxy_set_header Host slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-TV-Display-Key $http_x_tv_display_key;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
  }

  # Smart-TV browsers can struggle with the modern React bundle. Serve a
  # standalone kiosk page at /tv so the display does not depend on React/MSAL.
  location = /tv {
    try_files /tv.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
  location = /tv/ {
    try_files /tv.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
